<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>X-Range Hardware Video Wake Reset</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000000;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var isBounce = params.get('bounce') === '1';
      if (isBounce) {
        // Mount a 100% opaque, zero-OSD, full-viewport hardware H.264+AAC video
        // to force LG webOS out of Type-2 (Video+OSD 30-min cap) into Type-1 (Pure Fullscreen Video)
        var v = document.createElement('video');
        v.src = 'tv-keepawake-motion.mp4?t=' + Date.now();
        v.muted = true;
        v.autoplay = true;
        v.loop = true;
        v.playsInline = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
        document.body.appendChild(v);
        var p = v.play();
        if (p && p.catch) p.catch(function () {});

        // Return to the main X-Range dashboard after 4.5 seconds of pure Type-1 hardware video playback
        setTimeout(function () {
          window.location.replace('./?reset=' + Date.now());
        }, 4500);
      } else {
        document.title = 'keepalive-' + Date.now();
      }
    })();
  </script>
</body>
</html>
